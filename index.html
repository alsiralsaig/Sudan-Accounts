<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="حساباتي" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>حساباتي السودان - المحاسب الذكي ونقاط البيع بالصوت</title>
    <meta name="description" content="منصة محاسبية ذكية ونقاط بيع للمتاجر والأنشطة التجارية في السودان مع مساعد صوتي يفهم اللهجة المحلية وإدارة المخزون والوحدات السودانية." />
    <meta property="og:title" content="حساباتي السودان - المحاسب الذكي ونقاط البيع بالصوت" />
    <meta property="og:description" content="منصة محاسبية ذكية ونقاط بيع للمتاجر والأنشطة التجارية في السودان مع مساعد صوتي يفهم اللهجة المحلية وإدارة المخزون والوحدات السودانية." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta name="twitter:image" content="/og-banner.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script>
    // نظام التطبيقين: الإدارة (/) والعمال (/staff) — كل واحد بياخد manifest واسم تثبيت خاص
    (function () {
      var staff = location.pathname.replace(/\/+$/, '').indexOf('/staff') === 0;
      var m = document.createElement('link');
      m.rel = 'manifest';
      m.href = staff ? '/manifest-staff.webmanifest' : '/manifest-admin.webmanifest';
      document.head.appendChild(m);
      document.title = staff ? 'حساباتي — العمال' : 'حساباتي السودان — الإدارة';
      var t = document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if (t) t.setAttribute('content', staff ? 'حساباتي عمال' : 'حساباتي إدارة');
      // أيقونة تثبيت آيفون/آيباد لكل تطبيق
      var apple = document.querySelector('link[rel="apple-touch-icon"]');
      if (apple) apple.setAttribute('href', staff ? '/apple-touch-icon.png' : '/apple-touch-icon-admin.png');
    })();
  </script>
</head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
