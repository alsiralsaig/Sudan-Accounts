<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern / frame -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#10b981" stroke-width="6" stroke-opacity="0.3" />

  <!-- Cash Register & POS terminal shape -->
  <g transform="translate(64, 76)">
    <!-- Main POS base -->
    <rect x="34" y="160" width="316" height="170" rx="28" fill="#1e293b" stroke="#334155" stroke-width="8" />
    
    <!-- Screen -->
    <rect x="58" y="40" width="268" height="140" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="6" />
    <!-- Screen Inner Display -->
    <rect x="72" y="54" width="240" height="112" rx="10" fill="#022c22" />
    <!-- Screen lines (chart / Arabic symbol) -->
    <path d="M92 134 L142 98 L192 120 L242 74 L292 100" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="292" cy="100" r="8" fill="#fbbf24" />

    <!-- Barcode scanner beam -->
    <path d="M120 200 L264 200" stroke="#f43f5e" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 8" />

    <!-- Keypad buttons -->
    <circle cx="100" cy="245" r="14" fill="#334155" />
    <circle cx="140" cy="245" r="14" fill="#334155" />
    <circle cx="180" cy="245" r="14" fill="#334155" />
    <circle cx="100" cy="285" r="14" fill="#334155" />
    <circle cx="140" cy="285" r="14" fill="#334155" />
    <circle cx="180" cy="285" r="14" fill="#334155" />

    <!-- Green Enter button -->
    <rect x="214" y="235" width="110" height="64" rx="14" fill="url(#accentGrad)" />
    <!-- Arabic 'حساباتي' / Checkmark in button -->
    <path d="M246 268 L262 284 L294 252" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Receipt coming out -->
    <path d="M142 40 L142 0 L242 0 L242 40 Z" fill="#f8fafc" opacity="0.95" />
    <line x1="160" y1="12" x2="224" y2="12" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <line x1="160" y1="24" x2="204" y2="24" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Sudanese Star / Badge overlay on top right -->
  <g transform="translate(370, 70)">
    <circle cx="36" cy="36" r="38" fill="url(#goldGrad)" stroke="#fef08a" stroke-width="4" />
    <text x="36" y="44" font-family="sans-serif" font-weight="900" font-size="24" fill="#78350f" text-anchor="middle">🇸🇩</text>
  </g>
</svg>
